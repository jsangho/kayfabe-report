# KAYFABE 2.0 개발 결과 보고서 — 사이트 설정
#
# 이 파일은 `bundle exec jekyll serve` 시 자동으로 다시 읽히지 않는다.
# 값을 고쳤으면 서버 프로세스를 재시작한다.

# 정식 사업명. 표지 대제목과 <title> 에 쓴다.
title: WWE 경기 결과를 다중 AI 에이전트로 예측하고 그 근거와 정확도를 데이터로 검증하는 스포츠 분석 플랫폼
# 사업명이 길어 들어가지 않는 좁은 자리(상단 헤더, 푸터)에 쓰는 축약 제목.
title_short: 다중 에이전트 경기 예측·검증 플랫폼
# 본문 각 장 머리말에 쓰는 팀 마크. 사업명이 아니라 팀명이다.
brand: KayFabe
# 표지의 <title> 꼬리말. 없으면 jekyll-seo-tag 가 description 전문을 붙인다.
tagline: 개발 결과 보고서
email:
description: >- # this means to ignore newlines until "baseurl:"
  다중 에이전트 경기 예측·검증 플랫폼 개발 결과 보고서.
  요구사항 분석부터 시험 결과까지의 수행 내역을 정리한 문서입니다.
baseurl: "" # GitHub Actions 로 배포한다면 configure-pages 가 --baseurl 로 주입한다
# 사이트의 호스트. canonical·og:url 이 절대 경로로 나오려면 필요하다.
url: "https://jsangho.github.io"
github_username: jsangho

# Build settings
#
# 테마는 **just-the-docs** 다 (2026-10-01, minima 에서 옮겼다). 보고서가 9장으로
# 늘면서 minima 의 상단 한 줄 네비로는 지금 몇 장을 보고 있는지가 보이지 않았다.
# 좌측 사이드바는 전체 목차를 항상 띄워 두므로 장 사이를 오가는 비용이 사라진다.
# 팀 보고서(dev.supersub-ai.com)와 같은 테마라 두 문서를 나란히 둘 때도 읽는
# 방식이 같아진다.
theme: just-the-docs
plugins:
  - jekyll-feed

# ── just-the-docs 설정 ──────────────────────────────────────────────
# 색은 KAYFABE 제품 팔레트를 그대로 쓴다 (`_sass/color_schemes/kayfabe.scss`).
# 제품 화면과 보고서가 다른 색을 쓰면 4장(디자인 시스템)이 자기 말을 어긴다.
color_scheme: kayfabe

# 9장 분량이라 본문 검색이 목차보다 빠를 때가 많다.
search_enabled: true
search:
  heading_level: 3
  previews: 2
  tokenizer_separator: /[\s/]+/

heading_anchors: true
back_to_top: true
back_to_top_text: "위로"

# 각 페이지의 nav_order 값을 그대로 따른다 — 장 번호가 곧 순서다.
nav_sort: case_sensitive

aux_links:
  "저장소":
    - "https://github.com/jsangho/cloud.jsangho.all"
  "데모":
    - "https://www.jsangho.cloud"
aux_links_new_tab: true

footer_content: "KayFabe · 다중 에이전트 경기 예측·검증 플랫폼 개발 결과 보고서"

# front matter 없는 마크다운은 정적 파일로 그대로 복사되어 공개된다.
# 내부 문서는 반드시 여기에 넣는다.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
